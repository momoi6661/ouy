[project]
name = "ouy"
version = "2.0.0"
description = "欧易 Agent 盯盘交易 Agent：欧易官方 Agent 授权 + PydanticAI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "pydantic-ai-slim[openai]>=2.70",
  "mcp>=2.0",
  "httpx>=0.27",
  "fastembed>=0.5",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
ouy = "ouy.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ouy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
